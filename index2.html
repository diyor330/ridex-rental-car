<section class="section featured-car">

<div class="catalog-toolbar">
<div class="catalog-search">
<ion-icon aria-hidden="true" name="search-outline"></ion-icon>

<label class="catalog-select-label" for="brand-filter">メーカー</label>
<select aria-label="メーカーで絞り込む" class="catalog-select" id="brand-filter">
<option value="">すべてのメーカー</option>
</select>
<button class="catalog-reset" id="clear-filters" type="button">条件をクリア</button>
</div>
<div class="catalog-status">
<p aria-live="polite" id="catalog-count">車両を読み込んでいます…</p>
</div>
<ul aria-live="polite" class="featured-car-list" data-car-grid="catalog" id="car-catalog"></ul>
